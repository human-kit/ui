<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Anti-FOUC: apply the persisted theme before styles load.
			const theme = localStorage.getItem('theme');
			if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			}

			// Anti-FOUC: apply the persisted package-manager choice before paint, so the
			// install snippets render the right command + pressed tab on the first frame
			// instead of flashing 'pnpm' → the stored choice after hydration. The rules in
			// theme.css read <html data-pm>. Must stay in sync with
			// package-manager.svelte.ts (same key + managers).
			const pm = localStorage.getItem('docs:pm');
			document.documentElement.dataset.pm =
				pm === 'npm' || pm === 'yarn' || pm === 'bun' ? pm : 'pnpm';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
