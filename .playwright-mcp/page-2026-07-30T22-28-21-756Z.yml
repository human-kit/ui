                    - heading "Accessibility" [level=2] [ref=f18e298]
                    - list [ref=f18e299]:
                        - listitem [ref=f18e300]:
                            - code [ref=f18e301]: Table.Root
                            - text: renders an interactive
                            - code [ref=f18e302]: grid
                            - text: over native table markup, and keyboard navigation uses roving
                            - code [ref=f18e303]: tabindex
                            - text: across header and body cells.
                        - listitem [ref=f18e304]: Body rows can also become the active focus target when horizontal navigation moves past the start or end of a row, and repeated left/right navigation loops back into the opposite edge cell.
                        - listitem [ref=f18e305]:
                            - text: First-column body cells become
                            - code [ref=f18e306]: rowheader
                            - text: when their associated column has
                            - code [ref=f18e307]: rowHeader
                            - text: .
                        - listitem [ref=f18e308]: Disabled rows remain rendered and non-selectable, but are skipped by focus navigation.
                        - listitem [ref=f18e309]:
                            - code [ref=f18e310]: Table.SortTrigger
                            - text: renders the trigger button, while the header cell remains the roving-focus target; sort changes are mirrored into a polite live region for screen readers.
                        - listitem [ref=f18e311]:
                            - text: 'Column resize handles are keyboard accessible separators: press'
                            - code [ref=f18e312]: Enter
                            - text: to enter resize mode, use the horizontal arrow keys to resize,
                            - code [ref=f18e313]: Home
                            - text: to jump to the minimum width,
                            - code [ref=f18e314]: End
                            - text: to auto-fit, and
                            - code [ref=f18e315]: Enter
                            - text: again to exit.
