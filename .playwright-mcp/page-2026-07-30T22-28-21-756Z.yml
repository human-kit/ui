                    - paragraph [ref=f18e259]: 'Pagination stays consumer-owned: slice the dataset before rendering and drive the current page from external controls or app state.'
                    - heading "Usage guidelines" [level=2] [ref=f18e260]
                    - list [ref=f18e261]:
                        - listitem [ref=f18e262]:
                            - text: Use
                            - code [ref=f18e263]: Table.Root
                            - text: as the stateful container for focus, selection, and sorting state, and give it
                            - code [ref=f18e264]: aria-label
                            - text: or
                            - code [ref=f18e265]: aria-labelledby
                            - text: .
                        - listitem [ref=f18e266]:
                            - text: Wrap each header cell in
                            - code [ref=f18e267]: Table.Column
                            - text: so the table can register stable column metadata;
                            - code [ref=f18e268]: Table.Column
                            - text: renders no DOM by itself.
                        - listitem [ref=f18e269]:
                            - text: Use
                            - code [ref=f18e270]: selectedKeys
                            - text: /
                            - code [ref=f18e271]: onSelectionChange
                            - text: for controlled row selection and
                            - code [ref=f18e272]: defaultSelectedKeys
                            - text: for uncontrolled initial selection.
                        - listitem [ref=f18e273]:
                            - text: Use
                            - code [ref=f18e274]: selectionBehavior="toggle"
                            - text: to allow deselecting an already selected row, or
                            - code [ref=f18e275]: '"replace"'
                            - text: to keep selected rows selected when pressed again.
                        - listitem [ref=f18e276]:
                            - text: Use
                            - code [ref=f18e277]: sortDescriptor
                            - text: /
                            - code [ref=f18e278]: onSortChange
                            - text: for controlled sorting and
                            - code [ref=f18e279]: defaultSortDescriptor
                            - text: for uncontrolled initial sort state;
                            - code [ref=f18e280]: Table.SortTrigger
                            - text: inside a header cell makes the owning column sortable.
                        - listitem [ref=f18e281]:
                            - text: Use
                            - code [ref=f18e282]: columnWidths
                            - text: /
                            - code [ref=f18e283]: onColumnWidthsChange
                            - text: for controlled column widths (px,
                            - code [ref=f18e284]: '%'
                            - text: ', or'
                            - code [ref=f18e285]: fr
                            - text: ), and add
                            - code [ref=f18e286]: Table.ColumnResizer
                            - text: inside
                            - code [ref=f18e287]: Table.ColumnHeaderCell
                            - text: to make a column resizable.
                        - listitem [ref=f18e288]:
                            - text: Dedicated utility columns like selection checkboxes should usually set an explicit
                            - code [ref=f18e289]: width
                            - text: ','
                            - code [ref=f18e290]: minWidth
                            - text: ', and'
                            - code [ref=f18e291]: maxWidth
                            - text: 'on'
                            - code [ref=f18e292]: Table.Column
                            - text: so sibling resizes do not redistribute their space.
                        - listitem [ref=f18e293]:
                            - text: Use
                            - code [ref=f18e294]: Table.EmptyState
                            - text: inside
                            - code [ref=f18e295]: Table.Body
                            - text: instead of conditionally rendering freeform body content.
                        - listitem [ref=f18e296]:
                            - text: Use
                            - code [ref=f18e297]: Table.InteractiveCell
