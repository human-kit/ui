                        - listitem [ref=f16e267]:
                            - text: Wrap each header cell in
                            - code [ref=f16e268]: Table.Column
                            - text: so the table can register stable column metadata;
                            - code [ref=f16e269]: Table.Column
                            - text: renders no DOM by itself.
                        - listitem [ref=f16e270]:
                            - text: Use
                            - code [ref=f16e271]: selectedKeys
                            - text: /
                            - code [ref=f16e272]: onSelectionChange
                            - text: for controlled row selection and
                            - code [ref=f16e273]: defaultSelectedKeys
                            - text: for uncontrolled initial selection.
                        - listitem [ref=f16e274]:
                            - text: Use
                            - code [ref=f16e275]: selectionBehavior="toggle"
                            - text: to allow deselecting an already selected row, or
                            - code [ref=f16e276]: '"replace"'
                            - text: to keep selected rows selected when pressed again.
                        - listitem [ref=f16e277]:
                            - text: Use
                            - code [ref=f16e278]: sortDescriptor
                            - text: /
                            - code [ref=f16e279]: onSortChange
                            - text: for controlled sorting and
                            - code [ref=f16e280]: defaultSortDescriptor
                            - text: for uncontrolled initial sort state;
                            - code [ref=f16e281]: Table.SortTrigger
