              - code [ref=f17e304]: tabindex
              - text: across header and body cells.
            - listitem [ref=f17e305]: Body rows can also become the active focus target when horizontal navigation moves past the start or end of a row, and repeated left/right navigation loops back into the opposite edge cell.
