          - heading "Usage guidelines" [level=2] [ref=f19e260]
          - list [ref=f19e261]:
            - listitem [ref=f19e262]:
              - text: Use
              - code [ref=f19e263]: Table.Root
              - text: as the stateful container for focus, selection, and sorting state, and give it
              - code [ref=f19e264]: aria-label
              - text: or
