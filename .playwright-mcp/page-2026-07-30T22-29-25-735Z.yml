              - code [ref=f19e268]: Table.Column
              - text: renders no DOM by itself.
            - listitem [ref=f19e269]:
              - text: Use
              - code [ref=f19e270]: selectedKeys
              - text: /
              - code [ref=f19e271]: onSelectionChange
              - text: for controlled row selection and
              - code [ref=f19e272]: defaultSelectedKeys
              - text: for uncontrolled initial selection.
            - listitem [ref=f19e273]:
              - text: Use
              - code [ref=f19e274]: selectionBehavior="toggle"
              - text: to allow deselecting an already selected row, or
              - code [ref=f19e275]: "\"replace\""
              - text: to keep selected rows selected when pressed again.
            - listitem [ref=f19e276]:
              - text: Use
              - code [ref=f19e277]: sortDescriptor
              - text: /
              - code [ref=f19e278]: onSortChange
              - text: for controlled sorting and
              - code [ref=f19e279]: defaultSortDescriptor
              - text: for uncontrolled initial sort state;
              - code [ref=f19e280]: Table.SortTrigger
              - text: inside a header cell makes the owning column sortable.
            - listitem [ref=f19e281]:
