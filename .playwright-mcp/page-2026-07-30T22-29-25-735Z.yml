              - code [ref=f19e307]: rowHeader
              - text: .
            - listitem [ref=f19e308]: Disabled rows remain rendered and non-selectable, but are skipped by focus navigation.
            - listitem [ref=f19e309]:
              - code [ref=f19e310]: Table.SortTrigger
              - text: renders the trigger button, while the header cell remains the roving-focus target; sort changes are mirrored into a polite live region for screen readers.
            - listitem [ref=f19e311]:
