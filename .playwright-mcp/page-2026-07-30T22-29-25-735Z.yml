          - heading "Accessibility" [level=2] [ref=f19e298]
          - list [ref=f19e299]:
            - listitem [ref=f19e300]:
              - code [ref=f19e301]: Table.Root
              - text: renders an interactive
              - code [ref=f19e302]: grid
              - text: over native table markup, and keyboard navigation uses roving
              - code [ref=f19e303]: tabindex
              - text: across header and body cells.
            - listitem [ref=f19e304]: Body rows can also become the active focus target when horizontal navigation moves past the start or end of a row, and repeated left/right navigation loops back into the opposite edge cell.
            - listitem [ref=f19e305]:
              - text: First-column body cells become
              - code [ref=f19e306]: rowheader
