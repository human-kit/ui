globs:
  - docs/**/*.md
  - packages/**/*.md
ignores:
  - '**/node_modules/**'
  # Svelte-flavored markdown content (frontmatter + components), not plain markdown
  - 'docs/src/content/**'
  - '**/.svelte-kit/**'
  - '**/.vercel/**'
  - '**/dist/**'
config:
  MD013: false
  MD052: false
  MD024:
    siblings: true
