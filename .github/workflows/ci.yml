name: CI

on:
  pull_request:
    branches: [main]
  # Also on main: a cache saved by a pull request is visible only to that pull
  # request, and one saved on main is visible to all of them.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

  test:
    name: Test
    # Pinned: when `ubuntu-latest` moved to 26.04 (October 2026), the browser tests began
    # to lose their iframe in the middle of a run ("Cannot connect to the iframe",
    # "Failed to fetch dynamically imported module") or to hang, with the same code that
    # passed on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The key is the installed Playwright version. `hashFiles` on the package in
      # `node_modules` gave an empty hash (pnpm links it from outside the workspace),
      # so the key never changed and the browsers were downloaded on every run.
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(cd packages/ui && pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd packages/ui && pnpm exec playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd packages/ui && pnpm exec playwright install-deps chromium

      - run: pnpm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          # Skip check if PR doesn't touch library source
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'packages/ui/src/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "No library source changes detected, skipping changeset check."
            exit 0
          fi

          # Check if a changeset file exists (not config.json or README.md)
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null || true)
          if [ -z "$CHANGESETS" ]; then
            echo "::error::This PR changes library source code but is missing a changeset."
            echo "Run 'pnpm exec changeset' to add one describing your changes."
            exit 1
          fi

          echo "Changeset found:"
          echo "$CHANGESETS"
